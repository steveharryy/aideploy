# Service catalog: the single source of truth for the REAL repos the pipeline may plan and change.
#
# Repos are the pipeline's own clean clones in ai-orchestrator/.repos/<repo> (gitignored),
# on baseBranch. Developers' working copies (e.g. ~/Work/<repo>) are never read or touched.
# Refresh before a planning run:  git -C .repos/<repo> pull --ff-only
#
# Fields per repo:
#   id          unique id (used by plans and the component map)
#   path        absolute, or relative to REPOSITORIES_ROOT (default: ai-orchestrator/repositories)
#   baseBranch  the branch planning reads and ticket branches start from (team decision: PRE, the integration branch; gb-bo-admin-fe uses lower-case "pre")
#   bitbucket   where pull requests are opened
#   keywords    whole-word hints for routing (the Planning Agent confirms in the code)
#   verify      commands that must ALL pass, starting with install
#
# Not listed: gb-webhook-api-service (its main branch has no code yet; code lives on QA/PRE).
# The dummy demo repos (repo-a/b/c) live in tests/fixtures/sample-catalog.yaml, for tests and --demo only.

repos:
  - id: gb-homepage-api
    name: GameBull Homepage API (homepage-service)
    purpose: >-
      Read-only Express/TypeScript API serving homepage, event, market and SportsBull data from Redis;
      proxies user activity/exposure to the Match and ATH services.
    owner: gamebull
    path: ../.repos/gb-homepage-api-service
    baseBranch: PRE
    bitbucket: { workspace: rosstech, repo: gb-homepage-api-service }
    keywords: [homepage-service, gb-homepage, homepage, getExposure, ActivityController, EventController, MarketController,
               HomePageController, SportsBullController, IpService, buildEventsV2Response, getUserCountry]
    modules: [homepage-service]
    verify:
      - { name: install, run: npm install --no-package-lock --no-audit --no-fund, timeoutSec: 600 }
      - { name: build, run: npm run build }

  - id: gb-payments-api
    name: GameBull Payments API
    purpose: >-
      Express/TypeORM (MySQL/Postgres) + Redis API for deposits, withdrawals, transactions and wallet
      responses; payment gateway integrations (fzpay, PayPlus, WebXPay, 0xProcessing crypto) and backoffice
      payment endpoints.
    owner: gamebull
    path: ../.repos/gb-payments-api-service
    baseBranch: PRE
    bitbucket: { workspace: rosstech, repo: gb-payments-api-service }
    keywords: [deposit, withdrawal, withdraw, payments-api, payment gateway, fzpay, payplus, webxpay, oxprocessing,
               0xprocessing, crypto network, transactionController, walletResponse]
    modules: [payments]
    verify:
      - { name: install, run: npm ci --no-audit --no-fund, timeoutSec: 600 }
      - { name: build, run: npm run build }
      - { name: test, run: npm test }

  - id: gb-event-api
    name: GameBull Event API
    purpose: >-
      Express/TypeORM + Redis/DynamoDB API for sports events, markets, categories, seasons, teams, banners,
      images, MMP and activity data.
    owner: gamebull
    path: ../.repos/gb-event-api-service
    baseBranch: PRE
    bitbucket: { workspace: rosstech, repo: gb-event-api-service }
    keywords: [event-api, event-service, mmp, season, banner, category, team, eventController, marketController]
    modules: [events]
    verify:
      - { name: install, run: npm install --no-package-lock --no-audit --no-fund, timeoutSec: 600 }
      - { name: build, run: npm run build }

  - id: gb-onboarding-api
    name: GameBull Onboarding API
    purpose: >-
      Express/TypeORM + Redis/DynamoDB/SES API for user onboarding (signup, login, users), clients, exchange,
      game providers (Alea, QTech), Freshdesk and backoffice user endpoints.
    owner: gamebull
    path: ../.repos/gb-onboarding-api-service
    baseBranch: PRE
    bitbucket: { workspace: rosstech, repo: gb-onboarding-api-service }
    keywords: [onboarding, signup, sign up, registration, login, otp, freshdesk, qtech, alea, onboarding-service]
    modules: [onboarding]
    verify:
      - { name: install, run: npm install --no-package-lock --no-audit --no-fund, timeoutSec: 600 }
      - { name: build, run: npm run build }

  - id: gb-backoffice-api
    name: GameBull Backoffice API
    purpose: >-
      Express/TypeORM API behind the backoffice: admin users, roles and permissions, activity log and
      webhook endpoints.
    owner: gamebull
    path: ../.repos/gb-backoffice-api-service
    baseBranch: PRE
    bitbucket: { workspace: rosstech, repo: gb-backoffice-api-service }
    keywords: [backoffice-api, backoffice api, permission, permissions, role, roles, admin user, WebhookController]
    modules: [backoffice-api]
    verify:
      - { name: install, run: npm install --no-package-lock --no-audit --no-fund, timeoutSec: 600 }
      - { name: build, run: npm run build }

  - id: gb-bo-admin-fe
    name: GameBull Backoffice Admin (web)
    purpose: >-
      Next.js/React backoffice admin web app used by ops and support (users, payments and withdrawals,
      dashboards); talks to the backoffice, payments and event APIs.
    owner: gamebull
    path: ../.repos/gb-bo-admin-fe
    baseBranch: pre
    bitbucket: { workspace: rosstech, repo: gb-bo-admin-fe }
    keywords: [admin panel, backoffice ui, bo-admin, admin-fe, backoffice screen]
    modules: [backoffice-ui]
    verify:
      - { name: install, run: pnpm install --frozen-lockfile, timeoutSec: 900 }
      - { name: test, run: pnpm exec vitest run --passWithNoTests }
      - { name: build, run: pnpm run build, timeoutSec: 900 }

  - id: gamebull-web
    name: GameBull player web app (gamebull-global-new)
    purpose: >-
      Player-facing GameBull web app (React, TanStack Start/Router, Vite SSR): sportsbook and casino screens,
      wallet, deposit/withdrawal UI, onboarding and profile.
    owner: gamebull
    path: ../.repos/gamebull-global-new
    baseBranch: PRE
    bitbucket: { workspace: rosstech, repo: gamebull-global-new }
    keywords: [gamebull-global, gamebull web, player app, website, frontend, ui, ux, screen, page, button]
    modules: [player-web]
    verify:
      - { name: install, run: pnpm install --frozen-lockfile, timeoutSec: 900 }
      - { name: test, run: pnpm exec vitest run --passWithNoTests }
      - { name: build, run: pnpm run build, timeoutSec: 900 }
